name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://synapse:synapse@localhost:5432/synapse?schema=public
      FRONTEND_URL: http://localhost:5173
      JWT_ACCESS_SECRET: test-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-different-and-at-least-32-characters
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: synapse
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test --runInBand

      - name: End-to-end tests
        run: pnpm test:e2e --runInBand

      - name: Build
        run: pnpm build
