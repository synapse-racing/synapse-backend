services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { if (!db.hello().setName) rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) } catch (e) {} quit(db.hello().setName === 'rs0' && db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 30
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/synapse?replicaSet=rs0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
